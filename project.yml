name: DriverProROI

options:
  bundleIdPrefix: com.driverpro
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  DriverProROI:
    type: application
    platform: iOS
    sources:
      - path: DriverProROI
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: DriverProROI
        PRODUCT_BUNDLE_IDENTIFIER: com.driverpro.roi
        INFOPLIST_FILE: DriverProROI/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: DriverProROI/DriverProROI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: DriverProWidgets

  DriverProWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DriverProWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: DriverProWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.driverpro.roi.widgets
        INFOPLIST_FILE: DriverProWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: DriverProWidgets/DriverProWidgets.entitlements
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  DriverProROI:
    build:
      targets:
        DriverProROI: all
        DriverProWidgets: all
    run:
      config: Debug
    archive:
      config: Release
