name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      instrumented:
        description: "Rodar testes instrumentados no emulador (mais lento)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes + APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.DI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Testes unitários
        run: gradle testDebugUnitTest --stacktrace

      - name: APK debug
        run: gradle assembleDebug --stacktrace

      - name: Keystore de release (opcional)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.DI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK release
        env:
          DI_KEYSTORE_PASSWORD: ${{ secrets.DI_KEYSTORE_PASSWORD }}
          DI_KEY_ALIAS: ${{ secrets.DI_KEY_ALIAS }}
          DI_KEY_PASSWORD: ${{ secrets.DI_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: driver-intelligence-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
