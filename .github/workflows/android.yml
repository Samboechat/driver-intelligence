name: Android CI

on:
  push:
    branches: [ main ]
    paths-ignore: [ "ios/**", ".github/workflows/ios.yml" ]
  pull_request:
    paths-ignore: [ "ios/**", ".github/workflows/ios.yml" ]
  workflow_dispatch:
    inputs:
      instrumented:
        description: "Rodar testes instrumentados no emulador (mais lento)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes + APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.DI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar, testar e gerar APK debug
        run: |
          set -o pipefail
          gradle assembleDebug testDebugUnitTest --continue 2>&1 | tee build.log

      - name: Resumo de erros (anotações)
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|^> |FAILED|Could not|Execution failed|tests completed|Test.*FAILED|Exception" build.log \
            | grep -v "^\s*at " | head -400 > errors.txt || true
          python3 - <<'PY'
          lines = [l.rstrip() for l in open('errors.txt', encoding='utf-8', errors='replace')]
          chunk = 40
          for i in range(0, min(len(lines), chunk * 10), chunk):
              msg = '\n'.join(lines[i:i+chunk]).replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f"::error title=build-{i//chunk}::{msg}")
          PY

      - name: Keystore de release (opcional, via secrets)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.DI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK release (assinado se a keystore existir)
        env:
          DI_KEYSTORE_PASSWORD: ${{ secrets.DI_KEYSTORE_PASSWORD }}
          DI_KEY_ALIAS: ${{ secrets.DI_KEY_ALIAS }}
          DI_KEY_PASSWORD: ${{ secrets.DI_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: driver-intelligence-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Página de download (Releases)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DriverIntelligence.apk
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao DriverIntelligence.apk \
            --title "Driver Intelligence — última versão" \
            --notes "Baixe o DriverIntelligence.apk abaixo e instale no celular. Gerado automaticamente a partir do commit ${GITHUB_SHA::7}."

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Publicar esquema do banco (Room)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/

  instrumented:
    name: Testes instrumentados (OCR sintético)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.instrumented }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador + connectedAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: gradle connectedDebugAndroidTest -PallAbis --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
